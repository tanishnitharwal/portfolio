<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glass Fill Gradient -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGlow)"/>

  <!-- Rotating Outer Rings & Dashed Tracks -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2" stroke-dasharray="30 15 10 15"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1"/>

  <!-- Tech Hexagon Shield -->
  <polygon points="200,85 295,140 295,260 200,315 105,260 105,140" fill="url(#glassFill)" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner Circuit Grid Details -->
  <path d="M 140 160 L 170 160 L 200 130 L 230 130 L 260 160" fill="none" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5"/>
  <path d="M 140 240 L 170 240 L 200 270 L 230 270 L 260 240" fill="none" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5"/>
  <circle cx="200" cy="130" r="3" fill="#10b981"/>
  <circle cx="200" cy="270" r="3" fill="#06b6d4"/>

  <!-- Stylized C++ & Monogram Symbol Core -->
  <g transform="translate(145, 145)">
    <!-- Main Diamond / Cube Frame -->
    <rect x="15" y="15" width="80" height="80" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="url(#neonGrad)" stroke-width="2.5"/>
    
    <!-- Stylized Monogram / C++ Logo -->
    <text x="55" y="66" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
      AV
    </text>
    
    <!-- C++ plus plus mini accents -->
    <text x="82" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#10b981">+</text>
    <text x="91" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#06b6d4">+</text>
  </g>

  <!-- Orbital Nodes -->
  <circle cx="330" cy="170" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="70" cy="230" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="200" cy="355" r="5" fill="#8b5cf6" filter="url(#glow)"/>
</svg>
